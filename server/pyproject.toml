[project]
name = "roomfit-server"
version = "0.1.0"
description = "RoomFit: 写真からの部屋復元ジョブと保存API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26,<3",
    "pillow>=10",
    "scipy>=1.11",
    "psutil>=7.2.2",
    # 写真からの復元。CPU 版の torch を使う（GPU は前提にしない）。
    "torch>=2.4",
    "torchvision>=0.19",
    "mapanything",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
mapanything = { git = "https://github.com/facebookresearch/map-anything.git" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
